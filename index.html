<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>物品英文识别APP高保真原型</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        iosBlue: '#007AFF',
                        iosGreen: '#34C759',
                        iosBg: '#F2F2F7',
                    },
                    fontFamily: {
                        sans: ['-apple-system', 'BlinkMacSystemFont', '"Segoe UI"', 'Roboto', 'Helvetica', 'Arial', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        /* 隐藏滚动条 */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* 扫描线动画 */
        @keyframes scan {
            0% { top: 10%; opacity: 0.8; }
            50% { top: 75%; opacity: 0.8; }
            100% { top: 10%; opacity: 0.8; }
        }
        .scanning-line {
            animation: scan 3s infinite linear;
        }
    </style>
</head>
<body class="bg-gray-900 min-h-screen flex items-center justify-center p-4 antialiased">

    <div class="relative w-[430px] h-[932px] bg-black rounded-[55px] shadow-[0_0_0_12px_#2b2b2b,0_25px_50px_-12px_rgba(0,0,0,0.8)] overflow-hidden border-4 border-gray-800 select-none">
        
        <div class="absolute top-3 left-1/2 transform -translate-x-1/2 w-[110px] h-[30px] bg-black rounded-full z-50 flex items-center justify-between px-3">
            <div class="w-3 h-3 bg-gray-900 rounded-full"></div>
            <div class="w-4 h-1 bg-gray-900 rounded-full"></div>
        </div>

        <div class="absolute top-0 left-0 right-0 h-11 flex justify-between items-center px-8 z-40 text-xs font-semibold text-black" id="statusBar">
            <div>15:04</div>
            <div class="flex items-center space-x-1.5">
                <i class="fas fa-signal"></i>
                <i class="fas fa-wifi"></i>
                <i class="fas fa-battery-full text-base"></i>
            </div>
        </div>

        <div id="screen-home" class="absolute inset-0 bg-iosBg pt-12 flex flex-col z-10 transition-all duration-300">
            <div class="px-6 pt-4 pb-2">
                <h1 class="text-3xl font-bold text-gray-900">LexiScan</h1>
                <p class="text-sm text-gray-500 mt-1">看见世界，解锁英语</p>
            </div>

            <div class="px-6 my-4">
                <button onclick="switchScreen('camera')" class="w-full bg-gradient-to-br from-iosBlue to-blue-600 rounded-3xl p-6 text-white text-left shadow-lg shadow-blue-500/20 hover:opacity-95 transition active:scale-[0.98]">
                    <div class="flex justify-between items-center mb-6">
                        <div class="w-12 h-12 bg-white/20 rounded-2xl flex items-center justify-center text-2xl">
                            <i class="fas fa-camera"></i>
                        </div>
                        <i class="fas fa-chevron-right opacity-60"></i>
                    </div>
                    <h2 class="text-xl font-bold">拍照识别物体</h2>
                    <p class="text-sm text-white/80 mt-1">Tap to Scan & Learn</p>
                </button>
            </div>

            <div class="flex-1 px-6 overflow-y-auto no-scrollbar pb-8">
                <div class="flex justify-between items-center mb-3">
                    <h3 class="text-sm font-semibold text-gray-500 uppercase tracking-wider">历史识别记录</h3>
                    <span class="text-xs text-iosBlue font-medium">查看全部</span>
                </div>

                <div class="space-y-3">
                    <div class="bg-white rounded-2xl p-3.5 flex items-center shadow-sm">
                        <img src="https://images.unsplash.com/photo-1512152272829-e3139592d56f?w=150&auto=format&fit=crop&q=60" class="w-14 h-14 object-cover rounded-xl bg-gray-100" alt="hamburger">
                        <div class="ml-4 flex-1">
                            <div class="flex justify-between items-baseline">
                                <h4 class="font-bold text-gray-800 text-base">Hamburger</h4>
                                <span class="text-[11px] text-gray-400">10分钟前</span>
                            </div>
                            <p class="text-xs text-gray-400 mt-0.5">/ˈhæmbɜːɡə(r)/</p>
                            <p class="text-xs text-gray-600 mt-1">n. 汉堡包</p>
                        </div>
                    </div>
                    <div class="bg-white rounded-2xl p-3.5 flex items-center shadow-sm">
                        <img src="https://images.unsplash.com/photo-1581091226825-a6a2a5aee158?w=150&auto=format&fit=crop&q=60" class="w-14 h-14 object-cover rounded-xl bg-gray-100" alt="laptop">
                        <div class="ml-4 flex-1">
                            <div class="flex justify-between items-baseline">
                                <h4 class="font-bold text-gray-800 text-base">Laptop</h4>
                                <span class="text-[11px] text-gray-400">2小时前</span>
                            </div>
                            <p class="text-xs text-gray-400 mt-0.5">/ˈlæptɒp/</p>
                            <p class="text-xs text-gray-600 mt-1">n. 笔记本电脑</p>
                        </div>
                    </div>
                    <div class="bg-white rounded-2xl p-3.5 flex items-center shadow-sm">
                        <img src="https://images.unsplash.com/photo-1544816155-12df9643f363?w=150&auto=format&fit=crop&q=60" class="w-14 h-14 object-cover rounded-xl bg-gray-100" alt="book">
                        <div class="ml-4 flex-1">
                            <div class="flex justify-between items-baseline">
                                <h4 class="font-bold text-gray-800 text-base">Book</h4>
                                <span class="text-[11px] text-gray-400">昨天</span>
                            </div>
                            <p class="text-xs text-gray-400 mt-0.5">/bʊk/</p>
                            <p class="text-xs text-gray-600 mt-1">n. 书，书籍</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div id="screen-camera" class="absolute inset-0 bg-black hidden z-20 flex flex-col justify-between pt-12 transition-all duration-300">
            <div class="absolute inset-0 z-0">
                <img src="https://images.unsplash.com/photo-1495474472287-4d71bcdd2085?w=600&auto=format&fit=crop&q=80" class="w-full h-full object-cover" alt="Camera preview desk with coffee and book">
                <div class="absolute inset-0 bg-black/10"></div>
            </div>

            <div class="relative z-30 flex justify-between items-center px-6 pt-2">
                <button onclick="switchScreen('home')" class="w-10 h-10 bg-black/40 backdrop-blur-md text-white rounded-full flex items-center justify-center">
                    <i class="fas fa-chevron-left text-lg"></i>
                </button>
                <button onclick="toggleFlash()" id="flashBtn" class="w-10 h-10 bg-black/40 backdrop-blur-md text-yellow-400 rounded-full flex items-center justify-center">
                    <i class="fas fa-bolt text-lg"></i>
                </button>
            </div>

            <div class="relative z-30 flex-1 flex items-center justify-center px-10">
                <div class="relative w-64 h-64 border-2 border-iosBlue/60 rounded-3xl shadow-[0_0_20px_rgba(0,122,255,0.3)] flex flex-col justify-between p-3">
                    <div class="absolute top-0 left-0 w-6 h-6 border-t-4 border-l-4 border-iosBlue rounded-tl-xl -mt-1 -ml-1"></div>
                    <div class="absolute top-0 right-0 w-6 h-6 border-t-4 border-r-4 border-iosBlue rounded-tr-xl -mt-1 -mr-1"></div>
                    <div class="absolute bottom-0 left-0 w-6 h-6 border-b-4 border-l-4 border-iosBlue rounded-bl-xl -mb-1 -ml-1"></div>
                    <div class="absolute bottom-0 right-0 w-6 h-6 border-b-4 border-r-4 border-iosBlue rounded-br-xl -mb-1 -mr-1"></div>
                    
                    <div id="scanLine" class="absolute left-2 right-2 h-0.5 bg-gradient-to-r from-transparent via-iosBlue to-transparent opacity-0 scanning-line shadow-[0_0_8px_#007AFF]"></div>

                    <div class="bg-iosBlue/80 backdrop-blur-sm text-white text-[11px] font-medium py-0.5 px-2 rounded-full self-start flex items-center space-x-1">
                        <i class="fas fa-brain text-[9px]"></i>
                        <span>检测到目标物体</span>
                    </div>
                </div>

                <div id="loadingToast" class="absolute bg-black/70 backdrop-blur-md text-white px-5 py-3 rounded-2xl flex items-center space-x-3 opacity-0 transition-opacity duration-300">
                    <svg class="animate-spin h-5 w-5 text-iosBlue" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                    <span class="text-sm font-medium">正在识别中，请稍候...</span>
                </div>
            </div>

            <div class="relative z-30 h-32 bg-gradient-to-t from-black/80 to-transparent flex justify-between items-center px-12 pb-6">
                <button class="w-12 h-12 bg-white/10 hover:bg-white/20 active:scale-95 transition rounded-full flex items-center justify-center text-white text-xl">
                    <i class="far fa-images"></i>
                </button>
                
                <button onclick="triggerCapture()" class="w-20 h-20 bg-transparent border-4 border-white rounded-full flex items-center justify-center p-1 active:scale-90 transition duration-150">
                    <div class="w-full h-full bg-white rounded-full shadow-inner"></div>
                </button>

                <div class="w-12 h-12"></div>
            </div>
        </div>

        <div id="screen-result" class="absolute inset-0 bg-black hidden z-30 flex flex-col justify-end pt-12 transition-all duration-300">
            <div class="absolute inset-0 z-0">
                <img src="https://images.unsplash.com/photo-1495474472287-4d71bcdd2085?w=600&auto=format&fit=crop&q=80" class="w-full h-full object-cover blur-md scale-105" alt="Frozen picture background">
                <div class="absolute inset-0 bg-black/30"></div>
            </div>

            <div onclick="switchScreen('camera')" class="absolute inset-0 z-10"></div>

            <div class="relative z-20 w-full bg-white/80 backdrop-blur-xl rounded-t-[40px] px-6 pt-3 pb-10 shadow-[0_-10px_30px_rgba(0,0,0,0.3)] border-t border-white/40 flex flex-col transform translate-y-0 transition-transform duration-500">
                
                <div class="w-10 h-1 bg-gray-400/40 rounded-full mx-auto mb-6"></div>

                <div class="flex justify-between items-start">
                    <div>
                        <h2 class="text-4xl font-extrabold text-gray-900 tracking-tight">Coffee Cup</h2>
                        <div class="flex items-center space-x-2 mt-2">
                            <span class="text-base text-gray-500 font-medium font-serif">/ˈkɒfi kʌp/</span>
                            <button onclick="playAudio()" class="w-7 h-7 bg-iosBlue/10 text-iosBlue rounded-full flex items-center justify-center text-xs active:scale-90 transition">
                                <i class="fas fa-volume-up" id="speakerIcon"></i>
                            </button>
                        </div>
                    </div>
                    <button onclick="toggleCollect(this)" class="w-11 h-11 bg-gray-100 rounded-full flex items-center justify-center text-gray-400 active:scale-90 transition">
                        <i class="fas fa-star text-lg"></i>
                    </button>
                </div>

                <div class="mt-6 bg-white/50 rounded-2xl p-4 border border-black/5 shadow-sm">
                    <span class="text-[11px] font-bold text-iosBlue uppercase tracking-wider block mb-1">中文释义</span>
                    <p class="text-xl font-bold text-gray-800">n. 咖啡杯</p>
                </div>

                <div class="mt-4 bg-white/50 rounded-2xl p-4 border border-black/5 shadow-sm">
                    <span class="text-[11px] font-bold text-iosGreen uppercase tracking-wider block mb-1">实用场景例句</span>
                    <p class="text-sm text-gray-700 italic">"He filled his coffee cup to the brim."</p>
                    <p class="text-xs text-gray-500 mt-1">他把咖啡杯倒得满满的。</p>
                </div>

                <div class="flex justify-center space-x-1.5 mt-6">
                    <div class="w-2 h-2 rounded-full bg-iosBlue"></div>
                    <div class="w-2 h-2 rounded-full bg-gray-300"></div>
                    <div class="w-2 h-2 rounded-full bg-gray-300"></div>
                </div>

                <div class="flex space-x-3 mt-6">
                    <button onclick="switchScreen('home')" class="flex-1 bg-gray-200/80 hover:bg-gray-200 text-gray-800 font-semibold py-3.5 rounded-2xl text-center active:scale-95 transition">
                        返回首页
                    </button>
                    <button onclick="switchScreen('camera')" class="flex-1 bg-iosBlue hover:bg-blue-600 text-white font-semibold py-3.5 rounded-2xl text-center shadow-md shadow-blue-500/10 active:scale-95 transition">
                        再拍一次
                    </button>
                </div>
            </div>
        </div>

        <div class="absolute bottom-1.5 left-1/2 transform -translate-x-1/2 w-[140px] h-[5px] bg-black rounded-full z-50" id="homeIndicator"></div>
    </div>

    <script>
        // 界面切换控制中心
        function switchScreen(screenId) {
            // 隐藏所有页面
            document.getElementById('screen-home').classList.add('hidden');
            document.getElementById('screen-camera').classList.add('hidden');
            document.getElementById('screen-result').classList.add('hidden');
            
            // 动态调节状态栏与底部指示条的黑白颜色（根据背景色适配）
            const statusBar = document.getElementById('statusBar');
            const homeIndicator = document.getElementById('homeIndicator');

            if (screenId === 'home') {
                document.getElementById('screen-home').classList.remove('hidden');
                statusBar.className = "absolute top-0 left-0 right-0 h-11 flex justify-between items-center px-8 z-40 text-xs font-semibold text-black";
                homeIndicator.className = "absolute bottom-1.5 left-1/2 transform -translate-x-1/2 w-[140px] h-[5px] bg-black rounded-full z-50";
            } else if (screenId === 'camera') {
                document.getElementById('screen-camera').classList.remove('hidden');
                statusBar.className = "absolute top-0 left-0 right-0 h-11 flex justify-between items-center px-8 z-40 text-xs font-semibold text-white";
                homeIndicator.className = "absolute bottom-1.5 left-1/2 transform -translate-x-1/2 w-[140px] h-[5px] bg-white rounded-full z-50";
                // 重置扫描线与加载状态
                document.getElementById('scanLine').classList.remove('opacity-0');
                document.getElementById('loadingToast').classList.add('opacity-0');
            } else if (screenId === 'result') {
                document.getElementById('screen-result').classList.remove('hidden');
                statusBar.className = "absolute top-0 left-0 right-0 h-11 flex justify-between items-center px-8 z-40 text-xs font-semibold text-white";
                homeIndicator.className = "absolute bottom-1.5 left-1/2 transform -translate-x-1/2 w-[140px] h-[5px] bg-black rounded-full z-50";
            }
        }

        // 模拟触发拍照与AI处理流程
        function triggerCapture() {
            const loadingToast = document.getElementById('loadingToast');
            const scanLine = document.getElementById('scanLine');
            
            // 1. 显示加载框
            loadingToast.classList.remove('opacity-0');
            
            // 2. 模拟2秒钟的AI云端网络请求与本地存储写入时间
            setTimeout(() => {
                switchScreen('result');
            }, 2000);
        }

        // 闪光灯切换
        let flashMode = true;
        function toggleFlash() {
            flashMode = !flashMode;
            const btn = document.getElementById('flashBtn');
            if(flashMode) {
                btn.className = "w-10 h-10 bg-black/40 backdrop-blur-md text-yellow-400 rounded-full flex items-center justify-center";
            } else {
                btn.className = "w-10 h-10 bg-black/40 backdrop-blur-md text-white/60 rounded-full flex items-center justify-center";
            }
        }

        // 发音按钮动画效果
        function playAudio() {
            const icon = document.getElementById('speakerIcon');
            icon.classList.remove('fa-volume-up');
            icon.classList.add('fa-volume-mute');
            // 模拟发音结束恢复图标
            setTimeout(() => {
                icon.classList.remove('fa-volume-mute');
                icon.classList.add('fa-volume-up');
            }, 800);
        }

        // 收藏夹星号高亮切换
        function toggleCollect(btn) {
            btn.classList.toggle('text-gray-400');
            btn.classList.toggle('text-yellow-500');
            btn.classList.toggle('bg-yellow-50');
        }
    </script>
</body>
</html>
